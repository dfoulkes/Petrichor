name: Deploy firmware

# OTA a previously-built, tagged firmware to the irrigation controller.
#
# Manual only, and deliberately so: this flashes a live device that controls
# water. It is never a side-effect of a merge.
#
# Dispatch this from `main` (that is where the workflow file is read from) and
# pass the tag you want. The job then checks out that tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Firmware tag to deploy (e.g. v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: petrichor-deploy
  cancel-in-progress: false      # never interrupt a flash mid-write

env:
  # The controller's address and ports, and the Infisical project id, are repo
  # secrets rather than literals — this repository is public and those describe
  # internal network topology. Note GitHub renders a MISSING secret as an empty
  # string, so the preflight step below asserts each one is actually set.
  ESPHOME_VERSION: "2026.7.0"
  INFISICAL_CLI_VERSION: "0.43.125"
  INFISICAL_DOMAIN: "https://infisical.foulkes.cloud/api"
  INFISICAL_ENV: "prod"
  INFISICAL_PATH: "/Petrichor"
  CI_ROOT: /opt/petrichor-ci
  CONFIG: petrichor.yaml
  DEVICE: petrichor

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Assert required secrets are present
        env:
          INFISICAL_TOKEN:      ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          TARGET_IP:            ${{ secrets.OTA_TARGET_IP }}
          OTA_PORT:             ${{ secrets.OTA_PORT }}
          API_PORT:             ${{ secrets.API_PORT }}
        run: |
          set -uo pipefail
          # A secret that does not exist renders as an EMPTY STRING, not an
          # error, so a typo'd or missing secret would surface much later as a
          # baffling connection failure. Name it here instead.
          missing=()
          for v in INFISICAL_TOKEN INFISICAL_PROJECT_ID TARGET_IP OTA_PORT API_PORT; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are set."

      - name: Checkout main (to read tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the tag exists
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist. Available:"
            git tag -l 'v*' --sort=-v:refname | head -10
            exit 1
          fi
          echo "Tag ${TAG} -> $(git rev-parse --short "refs/tags/${TAG}")"

      - name: Check out the tag
        run: git checkout --detach "refs/tags/${{ inputs.tag }}"

      - name: Resolve image tag
        id: img
        run: echo "tag=petrichor-esphome:${ESPHOME_VERSION}-${INFISICAL_CLI_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build CI image if absent
        run: |
          set -euo pipefail
          docker image inspect "${{ steps.img.outputs.tag }}" >/dev/null 2>&1 || \
            docker build -f docker/esphome-ci.Dockerfile \
              --build-arg "ESPHOME_VERSION=${ESPHOME_VERSION}" \
              --build-arg "INFISICAL_CLI_VERSION=${INFISICAL_CLI_VERSION}" \
              -t "${{ steps.img.outputs.tag }}" .

      - name: Stamp the firmware version
        run: |
          set -euo pipefail
          # `esphome -s fw_version X` does NOT override a substitution already
          # defined in the YAML — verified; the in-file value wins and every
          # build would ship stamped "dev". Rewrite the line instead. The
          # workspace is re-checked-out each run, so this is not persisted.
          sed -i -E 's/^(  fw_version: )".*"/\1"${{ inputs.tag }}"/' esphome/petrichor.yaml
          grep -E '^  fw_version:' esphome/petrichor.yaml

      - name: Fetch the firmware from MinIO
        id: fw
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/fw"; rm -rf "$DEST"; mkdir -p "$DEST"

          # Deploy the exact bits that were built and tagged. If the object is
          # missing, petrichor-store fails loudly rather than leaving an empty
          # directory — a silent recompile here would flash different firmware
          # from the one this tag was tested with.
          docker run --rm -u "$(id -u):$(id -g)" \
            --entrypoint petrichor-store \
            -e INFISICAL_TOKEN \
            -e INFISICAL_DOMAIN -e INFISICAL_PROJECT_ID \
            -e INFISICAL_ENV -e INFISICAL_PATH \
            -v "$DEST:/out" \
            "${{ steps.img.outputs.tag }}" \
            pull "${{ inputs.tag }}" /out

          [ -s "$DEST/firmware.ota.bin" ] || { echo "::error::firmware.ota.bin is missing or empty"; exit 1; }
          echo "Build metadata for ${{ inputs.tag }}:"
          cat "$DEST/build.json" 2>/dev/null || echo "  (none stored)"
          echo "dir=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Pre-flight — is the controller reachable?
        env:
          TARGET_IP: ${{ secrets.OTA_TARGET_IP }}
          OTA_PORT:  ${{ secrets.OTA_PORT }}
        run: |
          set -euo pipefail
          if timeout 3 bash -c "echo > /dev/tcp/${TARGET_IP}/${OTA_PORT}" 2>/dev/null; then
            echo "${TARGET_IP}:${OTA_PORT} is open."
          else
            echo "::error::Cannot reach ${TARGET_IP}:${OTA_PORT} (ESPHome OTA)."
            echo "Check: (1) the controller is powered and associated;"
            echo "       (2) the UniFi rule 'Allow golden-shower to Petrichor CI' (named"
            echo "           before the rename; the rule itself is still correct)"
            echo "           is enabled and sits below 'Block IOT to All'."
            exit 1
          fi

      - name: Upload over the air
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          TARGET_IP: ${{ secrets.OTA_TARGET_IP }}
        run: |
          set -euo pipefail
          # --network host: a bridged container cannot reach the IoT VLAN.
          # The entrypoint renders secrets.yaml because `esphome upload` parses
          # the whole config (for the OTA platform and password), not just the
          # one secret it needs.
          docker run --rm --network host \
            -u "$(id -u):$(id -g)" \
            -e INFISICAL_TOKEN \
            -e INFISICAL_DOMAIN -e INFISICAL_PROJECT_ID \
            -e INFISICAL_ENV -e INFISICAL_PATH \
            -v "$PWD/esphome:/config" \
            -v "${{ steps.fw.outputs.dir }}:/firmware:ro" \
            "${{ steps.img.outputs.tag }}" \
            upload "${CONFIG}" --device "${TARGET_IP}" --file /firmware/firmware.ota.bin

      - name: Verify the controller came back
        env:
          TARGET_IP: ${{ secrets.OTA_TARGET_IP }}
          API_PORT:  ${{ secrets.API_PORT }}
        run: |
          set -euo pipefail
          # Polling only for "does it answer" can pass WITHOUT the device ever
          # rebooting — an OTA that silently did nothing leaves the API port up
          # throughout, and the very first poll succeeds. So watch for the port
          # to drop first; that is the reboot. Then wait for it to return.
          echo "Waiting for ${TARGET_IP}:${API_PORT} to drop (the reboot)…"
          dropped=0
          for i in $(seq 1 30); do
            if ! timeout 2 bash -c "echo > /dev/tcp/${TARGET_IP}/${API_PORT}" 2>/dev/null; then
              dropped=1
              echo "  port dropped after ~$((i * 2))s — the device is rebooting"
              break
            fi
            sleep 2
          done
          if [ "$dropped" -eq 0 ]; then
            # Not fatal: a fast reboot can slip between two polls. But say so,
            # rather than reporting a confident success we have not earned.
            echo "::warning::API port never observed down — cannot confirm the device actually rebooted. Check the ESPHome version in Home Assistant."
          fi

          echo "Waiting for ${TARGET_IP}:${API_PORT} to answer again…"
          for i in $(seq 1 60); do
            if timeout 2 bash -c "echo > /dev/tcp/${TARGET_IP}/${API_PORT}" 2>/dev/null; then
              echo "Controller is back after ~$((i * 2))s."
              exit 0
            fi
            sleep 2
          done
          # An OTA reboot lands every valve OFF (restore_mode: ALWAYS_OFF), so
          # the failure mode here is dry, not flooded — but it still needs eyes.
          echo "::error::Controller did not answer on ${API_PORT} within 120s."
          exit 1

      - name: Summary
        run: |
          {
            echo "### Firmware deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ inputs.tag }}\` |"
            echo "| Target | (secret) |"
            echo "| Source | \`s3://petrichor/firmware/${{ inputs.tag }}/\` |"
          } >> "$GITHUB_STEP_SUMMARY"
